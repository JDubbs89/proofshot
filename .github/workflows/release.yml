name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "proofshot-${TAG}"
          cp proofshot.py install.sh README.md "proofshot-${TAG}/"
          tar -czf "proofshot-${TAG}.tar.gz" "proofshot-${TAG}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: proofshot-${{ github.ref_name }}.tar.gz
