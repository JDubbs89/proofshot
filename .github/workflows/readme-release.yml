name: Release README version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate README version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^Current version: `([^`]+)`.*/\1/p' README.md | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "README.md must contain: Current version: \`MAJOR.MINOR.PATCH\`" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Synchronize application version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("proofshot.py")
          source = path.read_text()
          updated, replacements = re.subn(
              r'(?m)^__version__\s*=\s*"[^"]+"$',
              f'__version__ = "{version}"',
              source,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not find __version__ in proofshot.py")
          path.write_text(updated)
          PY

          if ! git diff --quiet -- proofshot.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add proofshot.py
            git commit -m "Synchronize version to ${VERSION}"
            git push
          fi

      - name: Create release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          archive="proofshot-${tag}.tar.gz"
          staging="proofshot-${tag}"
          mkdir "$staging"
          cp proofshot.py install.sh uninstall.sh README.md "$staging/"
          tar -czf "$archive" "$staging"
          gh release create "$tag" "$archive" \
            --title "Proofshot $VERSION" \
            --generate-notes
