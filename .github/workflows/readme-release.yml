name: Release README version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate Python version
        id: version
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("proofshot.py").read_text()
          match = re.search(r'(?m)^__version__\s*=\s*"([^"]+)"$', source)
          if not match:
              raise SystemExit("Could not find __version__ in proofshot.py")
          print(match.group(1))
          PY
          )"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "proofshot.py __version__ must use MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          archive="proofshot-${tag}.tar.gz"
          staging="proofshot-${tag}"
          mkdir "$staging"
          cp proofshot.py default_config.json install.sh uninstall.sh README.md "$staging/"
          tar -czf "$archive" "$staging"
          gh release create "$tag" "$archive" \
            --title "Proofshot $VERSION" \
            --generate-notes
